<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number to Words</title>
<meta name="description" content="Type a number, read it in English. Handles arbitrarily large numbers.">
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --line: #2e333c;
    --text: #e7e9ee;
    --muted: #9aa2b1;
    --accent: #5b8cff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .brand { font-weight: 650; letter-spacing: .2px; margin-right: 6px; white-space: nowrap; }

  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    white-space: nowrap;
  }

  input[type="text"] {
    background: #12141a;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    font: inherit;
    font-size: 14px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    width: 11ch;
  }

  #number { width: 30ch; max-width: 60vw; }
  #number:focus { outline: none; border-color: var(--accent); }

  button {
    border: 1px solid var(--line);
    background: #262b33;
    color: var(--text);
    border-radius: 7px;
    padding: 7px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover { border-color: #4a515e; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; }
  button.primary:hover { background: #7aa2ff; border-color: #7aa2ff; }
  button:disabled { opacity: .5; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  button.primary:disabled:hover { background: var(--accent); border-color: var(--accent); }

  .spacer { flex: 1 1 auto; }
  .hint { color: var(--muted); font-size: 13px; }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px 12px 48px;
  }

  .panel {
    width: 100%;
    max-width: 760px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
  }

  .readout {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: baseline;
    min-height: 18px;
    color: var(--muted);
    font-size: 13px;
  }
  .readout .numeral { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all; }

  #words {
    margin-top: 14px;
    font-size: 1.45rem;
    line-height: 1.45;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  #words.placeholder, #words.error { font-size: 1rem; }
  #words.placeholder { color: var(--muted); }
  #words.error { color: #e8a33d; }

  #speakNote { margin-top: 12px; min-height: 18px; }

  .examples {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .examples button {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 10px;
  }
</style>
</head>
<body>

<div class="controls">
  <span class="brand">🔢 Number to Words</span>

  <label class="field">
    Number
    <input type="text" id="number" inputmode="decimal" spellcheck="false" autocomplete="off"
           autofocus placeholder="1234567">
  </label>

  <span class="spacer"></span>

  <button id="speak" class="primary" disabled>Speak</button>
  <button id="copy" disabled>Copy</button>
  <button id="clear">Clear</button>
</div>

<div class="stage">
  <div class="panel">
    <div class="readout">
      <span class="numeral" id="numeral"></span>
      <span id="count"></span>
    </div>
    <div id="words" class="placeholder">Type a number above to read it in English.</div>
    <div class="hint" id="speakNote"></div>
  </div>

  <div class="examples">
    <span>Try</span>
    <button data-example="1234567">1234567</button>
    <button data-example="3.14159">3.14159</button>
    <button data-example="-98765432100">-98765432100</button>
    <button data-example="1e100">1e100</button>
    <button data-example="1e303">1e303</button>
    <button data-example="1e3003">1e3003</button>
  </div>
</div>

<script src="words.js"></script>
<script>
(function () {
  'use strict';

  var MAX_LENGTH = 20000; // keeps pathological pastes from freezing the page

  var input = document.getElementById('number');
  var wordsEl = document.getElementById('words');
  var numeralEl = document.getElementById('numeral');
  var countEl = document.getElementById('count');
  var copyBtn = document.getElementById('copy');
  var speakBtn = document.getElementById('speak');
  var speakNote = document.getElementById('speakNote');

  function render() {
    var raw = input.value.trim();

    if (raw === '') {
      wordsEl.className = 'placeholder';
      wordsEl.textContent = 'Type a number above to read it in English.';
      numeralEl.textContent = '';
      countEl.textContent = '';
      copyBtn.disabled = true;
      speakBtn.disabled = true;
      speakNote.textContent = '';
      return;
    }

    if (raw.length > MAX_LENGTH) {
      show('error', 'That is longer than ' + MAX_LENGTH.toLocaleString() + ' characters.');
      return;
    }

    var words = NumberWords.numberToWords(raw);
    if (words === null) {
      show('error', 'Not a number.');
      return;
    }

    wordsEl.className = '';
    wordsEl.textContent = words;
    copyBtn.disabled = false;
    copyBtn.textContent = 'Copy';
    speakBtn.disabled = !speechSupported;
    speakNote.textContent = speechSupported ? estimateSpokenLength(words) : '';

    var parsed = NumberWords.parseNumber(raw);
    var formatted = NumberWords.formatNumeral(raw);
    numeralEl.textContent = formatted.length <= 120 ? formatted : '';

    var digits = parsed.integer.replace(/^0+(?=\d)/, '').length + parsed.fraction.length;
    countEl.textContent = digits + (digits === 1 ? ' digit' : ' digits');
  }

  function show(kind, message) {
    wordsEl.className = kind;
    wordsEl.textContent = message;
    numeralEl.textContent = '';
    countEl.textContent = '';
    copyBtn.disabled = true;
    speakBtn.disabled = true;
    speakNote.textContent = '';
  }

  input.addEventListener('input', function () {
    stopSpeaking();
    render();
  });

  // --- Speech ---------------------------------------------------------------------
  // Browsers mishandle a single very long utterance (Chrome cuts out after ~15s), so
  // the text is split into short chunks and spoken one after another.

  var speechSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  var CHUNK_SIZE = 180;
  var queue = [];
  var queueIndex = 0;
  var keepAlive = null;

  function chunkText(text) {
    var pieces = [];
    var rest = text;
    while (rest.length > CHUNK_SIZE) {
      // Prefer breaking at a comma, then any space, so chunks end on a natural pause.
      var head = rest.slice(0, CHUNK_SIZE);
      var cut = head.lastIndexOf(', ');
      if (cut > 0) cut += 1;
      else cut = head.lastIndexOf(' ');
      if (cut <= 0) cut = CHUNK_SIZE;
      pieces.push(rest.slice(0, cut).trim());
      rest = rest.slice(cut);
    }
    if (rest.trim()) pieces.push(rest.trim());
    return pieces;
  }

  function estimateSpokenLength(words) {
    // Rough: a spoken word takes about half a second.
    var seconds = Math.round(words.split(' ').length * 0.5);
    if (seconds < 20) return '';
    if (seconds < 120) return 'Reading this aloud takes roughly ' + seconds + ' seconds.';
    var minutes = Math.round(seconds / 60);
    if (minutes < 90) return 'Reading this aloud takes roughly ' + minutes + ' minutes.';
    return 'Reading this aloud takes roughly ' + Math.round(minutes / 60) + ' hours.';
  }

  function pickVoice() {
    var voices = speechSynthesis.getVoices() || [];
    return voices.find(function (v) { return /^en[-_]/i.test(v.lang) && v.default; }) ||
           voices.find(function (v) { return /^en[-_]/i.test(v.lang); }) || null;
  }

  function speakNext() {
    if (queueIndex >= queue.length) { stopSpeaking(); return; }

    var utterance = new SpeechSynthesisUtterance(queue[queueIndex]);
    utterance.lang = 'en-US';
    var voice = pickVoice();
    if (voice) utterance.voice = voice;
    utterance.onend = function () { queueIndex++; speakNext(); };
    utterance.onerror = function (e) {
      if (e.error !== 'interrupted' && e.error !== 'canceled') stopSpeaking();
    };
    speechSynthesis.speak(utterance);
  }

  function startSpeaking() {
    queue = chunkText(wordsEl.textContent);
    queueIndex = 0;
    if (!queue.length) return;

    speechSynthesis.cancel();
    speakBtn.textContent = 'Stop';
    // Chrome pauses long-running synthesis; nudging it keeps the queue moving.
    keepAlive = setInterval(function () {
      if (speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume();
    }, 5000);
    speakNext();
  }

  function stopSpeaking() {
    if (keepAlive) { clearInterval(keepAlive); keepAlive = null; }
    queue = [];
    queueIndex = 0;
    if (speechSupported) speechSynthesis.cancel();
    speakBtn.textContent = 'Speak';
  }

  speakBtn.addEventListener('click', function () {
    if (keepAlive) stopSpeaking();
    else startSpeaking();
  });

  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(wordsEl.textContent).then(function () {
      copyBtn.textContent = 'Copied';
      setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1200);
    });
  });

  document.getElementById('clear').addEventListener('click', function () {
    stopSpeaking();
    input.value = '';
    render();
    input.focus();
  });

  document.querySelectorAll('[data-example]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      stopSpeaking();
      input.value = btn.dataset.example;
      render();
      input.focus();
    });
  });

  window.addEventListener('beforeunload', stopSpeaking);

  if (!speechSupported) speakBtn.hidden = true;
  render();
})();
</script>
</body>
</html>
