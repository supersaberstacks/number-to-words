<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number to Words</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2f6bff;
    --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1c1f25;
      --text: #eceef2;
      --muted: #9aa1ad;
      --line: #2b2f37;
      --accent: #6d97ff;
      --error: #ff8a7a;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 6vh 20px 60px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  main { max-width: 720px; margin: 0 auto; }

  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 28px -20px rgba(0,0,0,.35);
  }

  #input {
    width: 100%;
    padding: 14px 16px;
    font: 600 1.9rem/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  #input::placeholder { color: var(--muted); font-weight: 400; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: baseline;
    margin-top: 10px;
    min-height: 20px;
    font-size: .82rem;
    color: var(--muted);
  }
  .meta .numeral { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }

  #words {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 1.5rem;
    line-height: 1.45;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  #words.placeholder { color: var(--muted); font-size: 1.15rem; }
  #words.error { color: var(--error); font-size: 1.15rem; }

  .actions { margin-top: 18px; display: flex; gap: 10px; }
  button {
    font: inherit;
    font-size: .85rem;
    padding: 7px 14px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .8; cursor: default; border-color: var(--line); color: var(--muted); }
  button:disabled:hover { border-color: var(--line); color: var(--muted); }

  #speak { border-color: var(--accent); color: var(--accent); }
  #speak:disabled { border-color: var(--line); color: var(--muted); }

  button.speaking { border-color: var(--accent); color: var(--accent); }

  .note { margin-top: 10px; min-height: 18px; font-size: .78rem; color: var(--muted); }

  .examples { margin-top: 22px; font-size: .82rem; color: var(--muted); }
  .examples button { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 4px 6px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Number to words</h1>

  <div class="card">
    <input id="input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
           autofocus placeholder="Type a number">

    <div class="meta">
      <span class="numeral" id="numeral"></span>
      <span id="count"></span>
    </div>

    <div id="words" class="placeholder">Whatever you type appears here in English.</div>

    <div class="actions">
      <button id="speak" disabled>Speak</button>
      <button id="copy" disabled>Copy words</button>
      <button id="clear">Clear</button>
    </div>
    <div class="note" id="speakNote"></div>
  </div>

  <div class="examples">
    Try:
    <button data-example="1234567">1234567</button>
    <button data-example="3.14159">3.14159</button>
    <button data-example="-98765432100">-98765432100</button>
    <button data-example="1e100">1e100</button>
    <button data-example="1e303">1e303</button>
    <button data-example="1e3003">1e3003</button>
  </div>
</main>

<script src="words.js"></script>
<script>
(function () {
  'use strict';

  var MAX_LENGTH = 20000; // keeps pathological pastes from freezing the page

  var input = document.getElementById('input');
  var wordsEl = document.getElementById('words');
  var numeralEl = document.getElementById('numeral');
  var countEl = document.getElementById('count');
  var copyBtn = document.getElementById('copy');
  var speakBtn = document.getElementById('speak');
  var speakNote = document.getElementById('speakNote');

  function render() {
    var raw = input.value.trim();

    if (raw === '') {
      wordsEl.className = 'placeholder';
      wordsEl.textContent = 'Whatever you type appears here in English.';
      numeralEl.textContent = '';
      countEl.textContent = '';
      copyBtn.disabled = true;
      speakBtn.disabled = true;
      speakNote.textContent = '';
      return;
    }

    if (raw.length > MAX_LENGTH) {
      show('error', 'That is longer than ' + MAX_LENGTH.toLocaleString() + ' characters.');
      return;
    }

    var words = NumberWords.numberToWords(raw);
    if (words === null) {
      show('error', 'Not a number.');
      return;
    }

    wordsEl.className = '';
    wordsEl.textContent = words;
    copyBtn.disabled = false;
    copyBtn.textContent = 'Copy words';
    speakBtn.disabled = !speechSupported;
    speakNote.textContent = speechSupported ? estimateSpokenLength(words) : '';

    var parsed = NumberWords.parseNumber(raw);
    var formatted = NumberWords.formatNumeral(raw);
    numeralEl.textContent = formatted.length <= 120 ? formatted : '';

    var digits = parsed.integer.replace(/^0+(?=\d)/, '').length + parsed.fraction.length;
    countEl.textContent = digits + (digits === 1 ? ' digit' : ' digits');
  }

  function show(kind, message) {
    wordsEl.className = kind;
    wordsEl.textContent = message;
    numeralEl.textContent = '';
    countEl.textContent = '';
    copyBtn.disabled = true;
    speakBtn.disabled = true;
    speakNote.textContent = '';
  }

  input.addEventListener('input', function () {
    stopSpeaking();
    render();
  });

  // --- Speech ---------------------------------------------------------------------
  // Browsers mishandle a single very long utterance (Chrome cuts out after ~15s), so
  // the text is split into short chunks and spoken one after another.

  var speechSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  var CHUNK_SIZE = 180;
  var queue = [];
  var queueIndex = 0;
  var keepAlive = null;

  function chunkText(text) {
    var pieces = [];
    var rest = text;
    while (rest.length > CHUNK_SIZE) {
      // Prefer breaking at a comma, then any space, so chunks end on a natural pause.
      var window_ = rest.slice(0, CHUNK_SIZE);
      var cut = window_.lastIndexOf(', ');
      if (cut > 0) cut += 1;
      else cut = window_.lastIndexOf(' ');
      if (cut <= 0) cut = CHUNK_SIZE;
      pieces.push(rest.slice(0, cut).trim());
      rest = rest.slice(cut);
    }
    if (rest.trim()) pieces.push(rest.trim());
    return pieces;
  }

  function estimateSpokenLength(words) {
    // Rough: a spoken word takes about half a second.
    var seconds = Math.round(words.split(' ').length * 0.5);
    if (seconds < 20) return '';
    if (seconds < 120) return 'Reading this aloud takes roughly ' + seconds + ' seconds.';
    var minutes = Math.round(seconds / 60);
    if (minutes < 90) return 'Reading this aloud takes roughly ' + minutes + ' minutes.';
    return 'Reading this aloud takes roughly ' + (Math.round(minutes / 60)) + ' hours.';
  }

  function pickVoice() {
    var voices = speechSynthesis.getVoices() || [];
    return voices.find(function (v) { return /^en[-_]/i.test(v.lang) && v.default; }) ||
           voices.find(function (v) { return /^en[-_]/i.test(v.lang); }) || null;
  }

  function speakNext() {
    if (queueIndex >= queue.length) { stopSpeaking(); return; }

    var utterance = new SpeechSynthesisUtterance(queue[queueIndex]);
    utterance.lang = 'en-US';
    var voice = pickVoice();
    if (voice) utterance.voice = voice;
    utterance.onend = function () { queueIndex++; speakNext(); };
    utterance.onerror = function (e) {
      if (e.error !== 'interrupted' && e.error !== 'canceled') stopSpeaking();
    };
    speechSynthesis.speak(utterance);
  }

  function startSpeaking() {
    queue = chunkText(wordsEl.textContent);
    queueIndex = 0;
    if (!queue.length) return;

    speechSynthesis.cancel();
    speakBtn.textContent = 'Stop';
    speakBtn.classList.add('speaking');
    // Chrome pauses long-running synthesis; nudging it keeps the queue moving.
    keepAlive = setInterval(function () {
      if (speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume();
    }, 5000);
    speakNext();
  }

  function stopSpeaking() {
    if (keepAlive) { clearInterval(keepAlive); keepAlive = null; }
    queue = [];
    queueIndex = 0;
    if (speechSupported) speechSynthesis.cancel();
    speakBtn.textContent = 'Speak';
    speakBtn.classList.remove('speaking');
  }

  speakBtn.addEventListener('click', function () {
    if (keepAlive) stopSpeaking();
    else startSpeaking();
  });

  // Voice list loads asynchronously in some browsers.
  if (speechSupported && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = function () {};
  }
  window.addEventListener('beforeunload', stopSpeaking);

  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(wordsEl.textContent).then(function () {
      copyBtn.textContent = 'Copied';
      setTimeout(function () { copyBtn.textContent = 'Copy words'; }, 1200);
    });
  });

  document.getElementById('clear').addEventListener('click', function () {
    stopSpeaking();
    input.value = '';
    render();
    input.focus();
  });

  document.querySelectorAll('[data-example]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      stopSpeaking();
      input.value = btn.dataset.example;
      render();
      input.focus();
    });
  });

  if (!speechSupported) speakBtn.hidden = true;
  render();
})();
</script>
</body>
</html>
